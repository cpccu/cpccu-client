name: Update Contributors

on:
  schedule:
    - cron: '05 19 * * *' # Runs every day at 01.05 Am BST (Bangladesh Standard Time)
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write  # This allows the Action to commit the updated JSON file

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          # Dedicated fine-grained PAT with read access to cpccu/cpccu-client
          # AND the private cpccu/cpccu-server repository. The default
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTOR_GITHUB_TOKEN }}
        run: python scripts/update_contributors.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/contributors.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update contributors.json" && git push origin HEAD:release)

name: Update Contributors

on:
  schedule:
    - cron: '30 19 * * 1,4' # Runs every Tuesday and Friday at 01.30 Am BST (Bangladesh Standard Time)
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write  # This allows the Action to commit the updated JSON file

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_contributors.py

      - name: Commit and push changes to all branches
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stage the changes
          git add data/contributors.json
          
          # Check if there are any changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Commit the changes
          git commit -m "chore: auto-update contributors.json"
          
          # Push to dev
          echo "Pushing to dev..."
          git push origin HEAD:dev
          
          # Push to main
          echo "Pushing to main..."
          git push origin HEAD:main
          
          # Push to release
          echo "Pushing to release..."
          git push origin HEAD:release
